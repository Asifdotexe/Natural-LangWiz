[project]
name = "natural-langwiz"
version = "0.1.0"
description = ""
authors = [{ name = "Asif Sayyed", email = "asifdotexe@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pandas (<3.0.0)",
    "streamlit (>=1.54.0,<2.0.0)",
    "yake (>=0.7.3,<0.8.0)",
    "wordcloud (>=1.9.6,<2.0.0)",
    "nltk (>=3.9.2,<4.0.0)",
    "spacy (>=3.8.11,<4.0.0)",
    "transformers (>=5.1.0,<6.0.0)",
    "sentence-transformers (>=5.2.2,<6.0.0)",
    "keybert (>=0.9.0,<0.10.0)",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
